[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contrail-structural-benchmark"
version = "0.2.0"
description = "Recovered MaxViT-U-Net training, contrail inference and physical/statistical audit code"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Jianing Yu"}]
dependencies = [
  "numpy>=2.0,<2.3",
  "pandas>=2.2,<3.0",
  "scipy>=1.13,<1.16",
  "scikit-learn==1.7.2",
  "opencv-python-headless>=4.10,<5.0",
  "torch>=2.5,<2.6",
  "torchvision>=0.20,<0.21",
  "timm>=1.0,<1.1",
  "segmentation-models-pytorch==0.5.0",
  "albumentations==1.4.24",
  "tqdm>=4.64,<5.0",
]

[project.urls]
Homepage = "https://github.com/jianingyu777/contrail-structural-benchmark"
Repository = "https://github.com/jianingyu777/contrail-structural-benchmark"
Issues = "https://github.com/jianingyu777/contrail-structural-benchmark/issues"

[project.optional-dependencies]
geo = [
  "xarray>=2024.10,<2025.7",
  "h5netcdf>=1.6,<1.7",
  "h5py>=3.14,<3.15",
  "rasterio>=1.4,<1.5",
  "pyproj>=3.7,<3.8",
  "shapely>=2.1,<2.2",
  "joblib>=1.4,<1.6",
  "xgboost==3.1.2",
]
test = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
contrail-train = "contrail_benchmark.segmentation.train:main"
contrail-evaluate = "contrail_benchmark.segmentation.evaluate:main"
contrail-infer-patches = "contrail_benchmark.segmentation.inference:patch_cli"
contrail-infer-scenes = "contrail_benchmark.segmentation.inference:scene_cli"
contrail-adsb-match = "contrail_benchmark.physical.adsb:match_cli"
contrail-adsb-null = "contrail_benchmark.physical.adsb:permutation_cli"
contrail-height-select = "contrail_benchmark.physical.height:main"
contrail-retrieve-tau = "contrail_benchmark.physical.lut:cli"
contrail-longwave = "contrail_benchmark.physical.longwave:cli"
contrail-fit-longwave-response = "contrail_benchmark.physical.longwave:fit_cli"
contrail-bootstrap = "contrail_benchmark.physical.statistics:cli"
contrail-sensitivity = "contrail_benchmark.physical.statistics:sensitivity_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contrail_benchmark = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
